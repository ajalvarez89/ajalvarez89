[project]
name = "trading_engine"
version = "0.1.0"
description = "Binance trading engine — order routing, risk manager, paper/live broker"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-binance==1.0.21",
    "redis==5.1.1",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "pyyaml==6.0.2",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "pandas==2.2.3",
    "pandas-ta==0.3.14b0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
