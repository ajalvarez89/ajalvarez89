[project]
name = "ml_service"
version = "0.1.0"
description = "ML service: forecasting (NeuralForecast), sentiment (FinBERT), feature store (DuckDB)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "redis==5.1.1",
    "duckdb==1.1.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pandas-ta==0.3.14b0",
    "structlog==24.4.0",
    "httpx==0.27.2",
    "pyyaml==6.0.2",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
ml = [
    "neuralforecast==1.7.5",
    "torch==2.4.1",
    "transformers==4.45.1",
    "vectorbt==0.26.2",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
